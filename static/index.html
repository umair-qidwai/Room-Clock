@font-face{font-family:FredokaClock;src:url('/fredoka-bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
:root{color-scheme:dark;--sage:#e3261b;--muted:#a97979;--white:#fff1ee;--line:#3a1f22}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030607;color:var(--white);font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid var(--sage);outline-offset:4px}
.app{height:100%;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,33%);gap:clamp(18px,3vw,52px);padding:clamp(16px,3vw,48px);padding-bottom:70px;align-items:center;background:radial-gradient(ellipse at 80% 30%,#2a0b0d66,transparent 65%)}
.clock-pane{min-width:0;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.date{position:absolute;top:2px;left:0;width:100%;z-index:2;color:var(--sage);font-size:clamp(18px,2.2vw,25px);letter-spacing:.055em;font-weight:700;line-height:1.2;text-align:center;white-space:nowrap}
.clock-row{display:flex;align-items:center;position:relative;width:100%;height:100%;min-width:0}
.time{width:100%;min-width:0;white-space:nowrap;font-family:FredokaClock,Arial Rounded MT Bold,Arial,sans-serif;font-weight:700;font-variant-numeric:proportional-nums;line-height:1;letter-spacing:-.035em;text-align:center;overflow:visible;color:var(--sage);text-shadow:0 2px 28px #e3261b14}
.time-face{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;width:max-content;transform:scaleY(1.3);transform-origin:center}
.time-char{display:inline-block;flex:none;position:relative;width:auto;line-height:1;text-align:center;overflow:visible}.time-char.colon{width:.24em;color:#ff3b30;letter-spacing:0}
.time-char>span{display:block}.time-char .leave{display:none}.time-char .enter{animation:digitEnter .28s ease-out}
@keyframes digitEnter{from{opacity:.15;transform:translateY(.08em)}to{opacity:1;transform:translateY(0)}}
.widgets{height:min(100%,560px);min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 8px;grid-template-rows:24px minmax(0,1fr);gap:8px}
.rail-title{grid-column:1;display:flex;align-items:center;justify-content:center;text-align:center;color:#855456;font-size:9px;letter-spacing:.18em;text-transform:uppercase;padding:0 3px}.rail{grid-column:1;grid-row:2;position:relative;min-height:0;overflow:hidden;touch-action:pan-x;user-select:none;cursor:grab}.rail.dragging{cursor:grabbing}.rail.dragging .card{pointer-events:none}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:clamp(12px,2vw,24px);border:1px solid var(--line);border-radius:22px;background:linear-gradient(150deg,#1b0f11,#0e0708);text-align:center;width:100%;height:100%;min-height:0;overflow:hidden;box-shadow:inset 0 1px 0 #ffffff06}
.card-heading{flex:none}.label{color:var(--muted);font-size:9px;letter-spacing:.18em;text-transform:uppercase}h2{font-size:clamp(20px,2.2vw,30px);font-weight:400;letter-spacing:-.025em;margin:5px 0 0}
.rings{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px 8px}.ring{min-height:0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}.ring-gauge{width:var(--gauge-size,80px);height:var(--gauge-size,80px);position:relative;flex:none}.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}.track{fill:none;stroke:#422126;stroke-width:2}.progress{fill:none;stroke:#e3261b;stroke-width:2.3;stroke-linecap:round;transition:stroke-dashoffset .6s ease}.ring-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;font-size:calc(var(--gauge-size,80px)*.235);line-height:1.2;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}.ring-value small{font-size:.48em;color:var(--muted)}.ring-name{font-size:10px;line-height:1.2;color:#b98f8f;white-space:nowrap;letter-spacing:.025em}
.dots{grid-column:2;grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.dot{width:3px;height:5px;background:#54292e;border-radius:6px}.dot.active{height:18px;background:var(--sage)}
.light-toggle{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));right:max(18px,env(safe-area-inset-right));top:auto;width:42px;height:42px;z-index:5;display:grid;place-items:center;border-radius:14px;background:#1b0c0e;border:1px solid #54282d;color:#c18f8f}.light-toggle svg{width:20px;height:20px}.light-toggle.on{background:#c62828;color:#210708;border-color:#c62828}.light-toggle.unknown{opacity:.45}.light-toggle.error{color:#f5a29c;border-color:#9b514b}
.sub,.weather-meta{font-size:13px;color:#c09b9b;line-height:1.5}.weather-line{display:flex;align-items:center;justify-content:center;gap:12px}.weather-icon{font-size:34px}.weather-temp{font-size:32px}.usage-heading{margin:0;font-size:clamp(22px,2.5vw,30px);font-weight:500;letter-spacing:.02em}.action{min-height:76px;font-size:17px;flex-shrink:0;box-shadow:inset 0 1px 0 #ffffff40;transition:background .15s,transform .15s;max-width:280px;width:100%;border:1px solid #e53935;border-radius:28px;background:#c62828;color:#210708;padding:12px 15px;font-weight:600}.action:active:not(:disabled){transform:scale(.98);background:#ff3b30}.action:disabled{opacity:.4;cursor:default}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#e53935;color:#210708;border-radius:12px;padding:10px 16px;font-size:12px;opacity:0;pointer-events:none;z-index:6}.toast.show{opacity:1}
.drag-card{transition:none}.settling{transition:transform .24s ease,opacity .24s ease}.widget-enter-up,.widget-enter-down{animation:widgetFade .25s ease}.widget-exit-up,.widget-exit-down{opacity:0;transition:opacity .15s}
@keyframes widgetFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(orientation:landscape) and (max-height:500px){.app{padding:8px 12px 54px;gap:14px;grid-template-columns:minmax(0,1fr) minmax(216px,29%)}.card{padding:12px;gap:8px;border-radius:18px}.rings{gap:7px}.widgets{gap:5px;grid-template-rows:22px minmax(0,1fr)}h2{font-size:20px}.ring-name{font-size:9px}.light-toggle{width:38px;height:38px;bottom:12px}}
@media(orientation:portrait){.app{grid-template-columns:1fr;grid-template-rows:minmax(0,.95fr) minmax(0,1fr);gap:18px;padding:24px 20px 70px}.widgets{width:100%;height:100%;max-width:480px;justify-self:center}.clock-pane{width:100%}.date{font-size:clamp(18px,4.8vw,25px)}.card{gap:10px;padding:14px}.rings{gap:8px}.rail-title{font-size:8px}}
/* Both pages keep their own stable layout while being dragged. Only the clock
   pane owns page gestures; the widget rail and fixed controls are independent. */
#pages{position:relative;width:100%;height:100dvh;overflow:hidden}
.page{position:absolute;inset:0;visibility:hidden;pointer-events:none}
.page:not([inert]),.page.preview{visibility:visible}
.page:not([inert]){pointer-events:auto}
.app.clock-only{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding:8px 12px}
.clock-only .time{font-variant-numeric:tabular-nums}
.clock-only .time-face{transform:none}
.clock-pane{touch-action:pan-x;user-select:none;cursor:grab}
.clock-pane:focus-visible{outline:1px solid var(--line);outline-offset:2px}
#pages.dragging .clock-pane{cursor:grabbing}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

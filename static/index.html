function paintTime(value,previous,animate){let face=document.createElement('span');face.className='time-face';face.dataset.value=value;let forceAll=animate&&previous&&previous.split(':')[0]!==value.split(':')[0];for(let i=0;i<value.length;i++){let slot=document.createElement('span'),ch=value[i],old=previous?.[i];slot.className='time-char'+(ch===':'?' colon':'');if(!animate||!old||old===ch){let stable=document.createElement('span');stable.className='static';stable.textContent=ch;slot.appendChild(stable)}else{let leaving=document.createElement('span'),entering=document.createElement('span');leaving.className='leave';leaving.textContent=old;entering.className='enter';entering.textContent=ch;slot.append(leaving,entering);leaving.addEventListener('animationend',()=>leaving.remove(),{once:true})}if(forceAll&&!slot.querySelector('.enter')&&ch!==':'){let stable=slot.querySelector('.static');if(stable){stable.className='leave';let entering=document.createElement('span');entering.className='enter';entering.textContent=ch;slot.appendChild(entering)}}face.appendChild(slot)}document.querySelectorAll('.time').forEach(time=>time.replaceChildren(face.cloneNode(true)));requestAnimationFrame(fitTime);setTimeout(fitTime,650)}function fitTime(){
